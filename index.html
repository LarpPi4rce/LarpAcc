<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARP Association</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins,Arial,sans-serif;
        }

        body{
            background:#090b12;
            color:white;
            overflow-x:hidden;
        }

        nav{
            position:fixed;
            width:100%;
            top:0;
            padding:20px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            backdrop-filter:blur(15px);
            background:rgba(255,255,255,.08);
            z-index:999;
        }

        nav h2{
            color:#67d8ff;
        }

        nav ul{
            display:flex;
            gap:30px;
            list-style:none;
        }

        nav a{
            color:white;
            text-decoration:none;
            transition:.3s;
        }

        nav a:hover{
            color:#67d8ff;
        }

        .hero{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:100px 20px;
            background:
            radial-gradient(circle at top,#1d3b68 0%,#090b12 60%);
        }

        .glass{
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.15);
            backdrop-filter:blur(20px);
            border-radius:25px;
            padding:60px;
            max-width:900px;
            animation:float 5s ease-in-out infinite;
        }

        h1{
            font-size:64px;
            margin-bottom:20px;
        }

        h1 span{
            color:#67d8ff;
        }

        p{
            color:#ddd;
            font-size:20px;
            margin-bottom:40px;
        }

        .btn{
            display:inline-block;
            padding:15px 35px;
            border-radius:40px;
            background:#67d8ff;
            color:black;
            text-decoration:none;
            font-weight:bold;
            transition:.3s;
        }

        .btn:hover{
            transform:scale(1.08);
        }

        @keyframes float{
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-15px);}
        }
    </style>
</head>

<body>

<nav>
<h2>LARP Association</h2>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Texture Packs</a></li>
<li><a href="#">Gallery</a></li>
<li><a href="#">About</a></li>
</ul>

</nav>

<section class="hero">

<div class="glass">

<h1>The Ultimate <span>LARP</span> Community</h1>

<p>
Modern Minecraft website with smooth animations, glassmorphism,
and premium styling.
</p>

<a class="btn" href="#">Join Now</a>

</div>

</section>

</body>
</html>
